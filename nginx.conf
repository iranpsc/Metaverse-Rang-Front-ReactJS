server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    types {
        text/javascript mjs;
        text/markdown md;
    }

    gzip on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        text/markdown;

    # JSON map tiles and styles
    location ~* ^/(tile|style)[^/]*\.json$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ARD configuration
    location = /.well-known/ard.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # LLMs documentation
    location = /llms.txt {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML should not be cached long-term
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}