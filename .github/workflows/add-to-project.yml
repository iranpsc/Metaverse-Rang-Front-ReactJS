name: Add Issue/PR to Project
on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
jobs:
  add-to-project:
    name: Add item to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/iranpsc/projects/2
          github-token: ${{ secrets.PROJECT_ADD_TOKEN }}
